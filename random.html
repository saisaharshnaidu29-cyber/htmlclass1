<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Random Number</title>
	<style>
		body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
		#display { font-size:48px; padding:20px 32px; border:2px solid #333; border-radius:8px; cursor:pointer; user-select:none; }
	</style>
</head>
<body>
	<div id="display">Click to start</div>

	<script>
		let timer = null;
		const display = document.getElementById('display');
		function rand() { return Math.floor(Math.random() * 1000); }

		display.addEventListener('click', () => {
			if (timer) {
				clearInterval(timer);
				timer = null;
				display.textContent = 'Click to start';
			} else {
				display.textContent = rand();
				timer = setInterval(() => display.textContent = rand(), 100);
			}
		});
	</script>
</body>
</html>
