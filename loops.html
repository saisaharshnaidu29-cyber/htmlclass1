<!DOCTYPE html>
<html>
    <body>
        <h2>java script for loops</h2>
        <p id="demo"></p>
        <script>
            var fruits = ["Banana", "Orange", "Apple", "Mango",  "grapes"];
            for (i = 0; i < fruits.length; i++) {
                var text = fruits[i] + "<br>";
                document.write(text);
            }
        </script>
    </body>
</html>
