<!DOCTYPE html>
<html>
<body>
    <h1>this page shows an error message</h1>
    <button type="button">click to show ERROR message</button>
    <script>
        document.querySelector("button").onclick = function() {
            try {
                throw new Error("An unexpected error has occurred.");
            } catch (e) {
                alert("ERROR: " + e.message);
            }
        };
    </script>
</body>
</html>
