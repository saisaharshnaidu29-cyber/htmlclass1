<!DOCTYPE html>
<html>
    <body>
        <h2>JS promises</h2>
        <p id="demo"></p>
        <script>
            function myDisplayer(some) {
                document.getElementById("demo").innerHTML = some;
            }
            function sum(a, b) {
                var sum = a + b;
             myDisplayer(sum);
            }
            let mypromise = new Promise(function (myReslove, myReject) {
                let x = 0;
                if (x == 0) {
                    myReslove("OK");
                }
                else {
                    myReject("Error");
                }
            });
            mypromise.then(
                function (value) { sum(5, 5); },
                function (error) { sum(error); }
            )
        </script>
    </body>
</html>
