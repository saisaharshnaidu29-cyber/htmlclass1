<!DOCTYPE html>
<html>
  <head>
    <title>Navbar</title>
    <h1>sai's food</h1>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      /* background image under everything */
      .bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url('https://ipshealth.co.za/wp-content/uploads/2022/06/Processed-Foods.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.95;
      }
      .topnav {
        overflow: hidden;
        background-color: #fc0000a8;
      }
      .topnav a {
        float: left;
        color: #0e85d4;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }
      .topnav a:hover {
        background-color: #02b4b4;
        color: rgb(0, 0, 0);
      }
      .topnav a.active {
        background-color: #28b80b54;
        color: rgba(0, 0, 0, 0.158);
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="topnav">
      <a class="active" href="#home">Home</a>
      <a href="#">About_Us</a>
      <a href="#">Gallery</a>
      <a href="#">Services</a>
      <a href="#">Offer</a>
      <a href="#">Contact_Us</a>
    </div>
  </body>
</html>
