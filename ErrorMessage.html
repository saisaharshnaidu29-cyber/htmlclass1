<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Message</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 20px;
            background-color: gold;
            color: darkred;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            color: salmon;
        }
        
    </style>
</head>
<body>
    <h1>Error Message</h1>
    <p>This page shows an error message.</p>
    <button type="button">Click to show error message.</button>
    <script>
        document.querySelector("button").addEventListener("click", function() {
            alert("An error has occurred. Please try again later.");
        });
    </script>
</body>
</html>
